overwrite: true
schema:
  - http://localhost:1337/graphql
documents: "graphql/**/*.graphql"
generates:
  graphql/types.tsx:
    plugins:
      - "typescript"
  graphql/:
    preset: near-operation-file
    presetConfig:
      extension: .generated.tsx
      baseTypesPath: types.ts
    plugins:
      - "typescript-operations"
      - "typescript-react-apollo"
    config:
      # Only the document and its result types are wanted: the homepage is
      # prerendered on the server, so no React hook is ever called.
      withHooks: false
      withComponent: false
      withHOC: false
